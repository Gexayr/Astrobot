# /etc/nginx/sites-available/astrobot -> symlink into /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d astrobot.example.com -d www.astrobot.example.com
server {
    listen 80;
    server_name astrobot.example.com www.astrobot.example.com;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
